services:
  musiclibraryoptimizer:
    build: .
    container_name: mlo
    ports:
      - "8000:8000"
    environment:
      - MLO_MUSIC_FOLDER=/music
    volumes:
      # Point this at your music library (artist/album folders).
      - ./music:/music
      # App state: config.json lives at /app/config.json, playlists at
      # /app/server/data/playlists.db — persist both across rebuilds.
      - mlo-config:/app/config.json
      - mlo-data:/app/server/data
    restart: unless-stopped

volumes:
  mlo-config:
  mlo-data: