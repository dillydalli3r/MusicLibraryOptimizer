name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          pip install pyinstaller mutagen pillow

      - name: Download pinned dependencies
        shell: pwsh
        run: |
          choco install 7zip -y --no-progress | Out-Null

          function Find-Dir($root, [string[]]$markers) {
            $dirs = Get-ChildItem -Path $root -Recurse -Directory -ErrorAction SilentlyContinue | Where-Object {
              foreach ($m in $markers) { if (-not (Test-Path (Join-Path $_.FullName $m))) { return $false } }
              return $true
            }
            $p = $dirs | Where-Object { $_.FullName -match 'x64|win64' } | Select-Object -First 1
            if ($p) { return $p.FullName }
            if ($dirs) { return $dirs[0].FullName }
            return $null
          }
          function Get-Zip($url, $zip, $dest) {
            Invoke-WebRequest -Uri $url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dest -Force
          }
          function Install-From($srcDir, [string[]]$markers, $outDir) {
            if (-not $srcDir) { Write-Warning "  source dir not found for $outDir"; return }
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
            foreach ($m in $markers) { Copy-Item (Join-Path $srcDir $m) $outDir -Force }
            Write-Host "  installed $outDir"
          }

          # AudioAuditor 2.0.0 (single self-contained exe)
          try {
            $out = ".dependencies\AudioAuditor v2.0.0\AudioAuditorCLI.exe"
            New-Item -ItemType Directory -Force -Path (Split-Path $out) | Out-Null
            Invoke-WebRequest -Uri "https://github.com/Angel2mp3/AudioAuditor/releases/download/V2.0.0/AudioAuditorCLI-win-x64.exe" -OutFile $out
            Write-Host "  installed AudioAuditor v2.0.0"
          } catch { Write-Warning "AudioAuditor: $_" }

          # FLAC 1.5.0
          try {
            Get-Zip "https://github.com/xiph/flac/releases/download/1.5.0/flac-1.5.0-win.zip" "$env:TEMP\flac.zip" "$env:TEMP\flac"
            Install-From (Find-Dir "$env:TEMP\flac" @("flac.exe","metaflac.exe")) @("flac.exe","metaflac.exe") ".dependencies\flac v1.5.0"
          } catch { Write-Warning "FLAC: $_" }

          # libjxl 0.12.0
          try {
            Get-Zip "https://github.com/libjxl/libjxl/releases/download/v0.12.0/jxl-x64-windows-static.zip" "$env:TEMP\jxl.zip" "$env:TEMP\jxl"
            Install-From (Find-Dir "$env:TEMP\jxl" @("cjxl.exe","djxl.exe")) @("cjxl.exe","djxl.exe") ".dependencies\libjxl v0.12.0"
          } catch { Write-Warning "libjxl: $_" }

          # libjpeg-turbo 3.2.0 (NSIS installer -> extract with 7-Zip)
          try {
            Invoke-WebRequest -Uri "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.2.0/libjpeg-turbo-3.2.0-vc-x64.exe" -OutFile "$env:TEMP\libjpeg.exe"
            New-Item -ItemType Directory -Force -Path "$env:TEMP\libjpeg" | Out-Null
            7z x -y "-o$env:TEMP\libjpeg" "$env:TEMP\libjpeg.exe" | Out-Null
            Install-From (Find-Dir "$env:TEMP\libjpeg" @("jpegtran.exe")) @("jpegtran.exe") ".dependencies\libjpeg-turbo v3.2.0"
          } catch { Write-Warning "libjpeg-turbo: $_" }

          # oxipng 10.2.0
          try {
            Get-Zip "https://github.com/oxipng/oxipng/releases/download/v10.2.0/oxipng-10.2.0-x86_64-pc-windows-msvc.zip" "$env:TEMP\oxipng.zip" "$env:TEMP\oxipng"
            Install-From (Find-Dir "$env:TEMP\oxipng" @("oxipng.exe")) @("oxipng.exe") ".dependencies\oxipng v10.2.0"
          } catch { Write-Warning "oxipng: $_" }

          # rsgain 3.7
          try {
            Get-Zip "https://github.com/complexlogic/rsgain/releases/download/v3.7/rsgain-3.7-win64.zip" "$env:TEMP\rsgain.zip" "$env:TEMP\rsgain"
            Install-From (Find-Dir "$env:TEMP\rsgain" @("rsgain.exe")) @("rsgain.exe") ".dependencies\rsgain v3.7"
          } catch { Write-Warning "rsgain: $_" }

          # ffmpeg 2026.8.19 (autobuild N-126217)
          try {
            Get-Zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-19-19-21/ffmpeg-N-126217-ge1e325235e-win64-gpl.zip" "$env:TEMP\ffmpeg.zip" "$env:TEMP\ffmpeg"
            Install-From (Find-Dir "$env:TEMP\ffmpeg" @("ffmpeg.exe","ffprobe.exe")) @("ffmpeg.exe","ffprobe.exe") ".dependencies\ffmpeg v2026.8.19"
          } catch { Write-Warning "ffmpeg: $_" }

      - name: Set version from tag
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          Write-Host "Setting version to $ver"
          (Get-Content "mlo/__init__.py") -replace '__version__ = ".*"', "__version__ = `"$ver`"" | Set-Content "mlo/__init__.py" -Encoding utf8
          (Get-Content "Music Library Optimizer.iss") -replace '#define AppVersion ".*"', "#define AppVersion `"$ver`"" | Set-Content "Music Library Optimizer.iss" -Encoding utf8
          Write-Host "Updated mlo/__init__.py:"
          Get-Content "mlo/__init__.py" | Select-String "__version__"
          Write-Host "Updated ISS:"
          Get-Content "Music Library Optimizer.iss" | Select-String "AppVersion"

      - name: Build GUI executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "Music Library Optimizer" --icon app_icon.ico `
            --hidden-import mutagen.aac app.py

      - name: Build CLI executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console `
            --name mlo --icon app_icon.ico `
            --hidden-import mutagen.aac mlo_cli.py

      - name: Verify executables
        run: |
          foreach ($exe in @("dist\Music Library Optimizer.exe", "dist\mlo.exe")) {
            if (Test-Path $exe) {
              $size = (Get-Item $exe).Length / 1MB
              Write-Host "Built $exe ($([math]::Round($size, 1)) MB)"
            } else {
              Write-Error "Executable not found at $exe"
              exit 1
            }
          }

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not found, installing via Chocolatey..."
            choco install innosetup -y --no-progress
          }
          if (Test-Path $iscc) {
            Write-Host "Compiling installer with Inno Setup..."
            & $iscc "Music Library Optimizer.iss"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "ISCC failed with exit code $LASTEXITCODE"
              exit 1
            }
            $installer = Get-ChildItem dist\*.exe | Where-Object { $_.Name -like "MusicLibraryOptimizer_Setup_*" } | Select-Object -First 1
            if ($installer) {
              $size = $installer.Length / 1MB
              Write-Host "Built $($installer.FullName) ($([math]::Round($size, 1)) MB)"
            } else {
              Write-Error "Installer not found in dist/"
              exit 1
            }
          } else {
            Write-Error "Inno Setup not found at $iscc even after install attempt"
            exit 1
          }

      - name: Prepare portable build
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          $portable = "dist\MusicLibraryOptimizer_v${ver}_portable_x64.exe"
          Copy-Item -LiteralPath "dist\Music Library Optimizer.exe" -Destination $portable -Force
          $p = Get-Item -LiteralPath $portable
          Write-Host "Portable: $($p.FullName) ($([math]::Round($p.Length / 1MB, 1)) MB)"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/MusicLibraryOptimizer_v*_portable_x64.exe
            dist/MusicLibraryOptimizer_Setup_*_x64.exe
            dist/mlo.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}